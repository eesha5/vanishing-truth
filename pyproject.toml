[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projgeo"
version = "0.1.0"
description = "Projective-geometry consistency tests for AI-generated images"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",
    "pandas",
    "tqdm",
    "scikit-learn",
    "statsmodels",
    "joblib",
]

[project.optional-dependencies]
app = ["streamlit"]                                   # app/streamlit_app.py
report = ["python-docx", "python-pptx"]               # docs/report/build_*.py
generate = ["torch", "diffusers", "transformers", "accelerate"]   # scripts/generate_sdxl.py
collect = ["requests"]                                # scripts/collect_commons.py
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["projgeo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
