[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projgeo"
version = "0.1.0"
description = "Projective-geometry consistency tests for AI-generated images"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["projgeo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
